[package]
name = "eventlet-analyzer"
version = "0.1.0"
edition = "2021"
authors = ["eventlet-removal-team"]
description = "High-performance Rust toolkit for analyzing eventlet usage patterns in OpenStack projects"
license = "MIT"

[[bin]]
name = "eventlet-analyzer"
path = "src/main.rs"

[dependencies]
# CLI and argument parsing
clap = { version = "4.4", features = ["derive", "color"] }

# Parallel processing
rayon = "1.8"
tokio = { version = "1.35", features = ["full"] }

# Serialization and data formats
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
serde_yaml = "0.9"

# Text processing and parsing
regex = "1.10"
url = "2.5"
lazy_static = "1.4"

# CLI visualization and output
colored = "2.1"
indicatif = "0.17"
tabled = "0.15"
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "ttf"] }

# Error handling and utilities
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# File I/O optimization
memmap2 = "0.9"

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
